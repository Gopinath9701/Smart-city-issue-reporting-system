<!DOCTYPE html>
<html>
<head>
    <title>Submit Complaint</title>
    <style>
        .container { width: 60%; margin: 30px auto; padding: 20px; border: 1px solid #ddd; font-family: Arial; }
        textarea { width: 100%; height: 100px; padding: 10px; box-sizing: border-box; }
        select, input { width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="container">
        <h2>File a New Complaint</h2>
        <form action="SubmitComplaintServlet" method="POST">
    <label>Complaint Category</label>
    <select name="category">
        <option value="Roads">Roads</option> <option value="Electricity">Electricity</option>
        <option value="Sanitation">Sanitation</option>
        <option value="Water Supply">Water Supply</option>
    </select>

    <label>Description</label>
    <textarea name="description" placeholder="Explain the problem..."></textarea>

    <label>Location Details</label>
    <input type="text" name="location" placeholder="Enter street address">

    <button type="submit" style="background: #e67e22; color: white; padding: 15px;">Submit Complaint</button>
</form>
    </div>

    <script>
        document.getElementById('complaintForm').onsubmit = function(e) {
            e.preventDefault(); // Stop page from refreshing
            
            // Save data to browser memory
            localStorage.setItem('recentCategory', document.getElementById('category').value);
            localStorage.setItem('recentDesc', document.getElementById('description').value);
            localStorage.setItem('recentLoc', document.getElementById('location').value);
            localStorage.setItem('recentStatus', 'Open');

            alert('Complaint Submitted Successfully!');
            window.location.href = 'my_complaints.html'; // Go to history page
        };
    </script>
</body>
</html>
