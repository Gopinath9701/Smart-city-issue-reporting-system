<!DOCTYPE html>
<html lang="en">
<head>
    <title>Submit Complaint</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="mb-4">File a New Complaint</h2>
                    <form id="complaintForm">
                        <div class="mb-3">
                            <label for="category" class="form-label">Complaint Category</label>
                            <select class="form-select" id="category" name="category">
                                <option value="Roads">Roads</option>
                                <option value="Electricity">Electricity</option>
                                <option value="Sanitation">Sanitation</option>
                                <option value="Water Supply">Water Supply</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="4" placeholder="Explain the problem..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="location" class="form-label">Location Details (Street / Landmark)</label>
                            <input type="text" class="form-control" id="location" name="location" placeholder="Enter street address or landmark">
                        </div>
                        <div class="mb-3">
                            <label for="pincode" class="form-label">PIN Code</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="pincode" placeholder="Enter 6-digit PIN">
                                <button type="button" class="btn btn-outline-secondary" onclick="fetchArea()">Get Area</button>
                            </div>
                            <div id="pinHelp" class="form-text text-muted">
                                Enter PIN and click "Get Area" to auto-fill locality.
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="area" class="form-label">Area / Locality</label>
                            <input type="text" class="form-control" id="area" placeholder="Area will auto-fill from PIN" readonly>
                        </div>
                        <button type="submit" class="btn btn-warning text-white">
                            Submit Complaint
                        </button>
                    </form>
                    <p id="pinStatus" class="text-muted small mt-2"></p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="bootstrap.bundle.min.js"></script>
<script>
    async function fetchArea() {
        const pinInput = document.getElementById('pincode');
        const pin = pinInput.value.trim();
        const areaInput = document.getElementById('area');
        const status = document.getElementById('pinStatus');
        areaInput.value = "";
        status.textContent = "";
        if (pin.length !== 6 || !/^[0-9]{6}$/.test(pin)) {
            status.textContent = "Please enter a valid 6-digit PIN.";
            status.classList.remove("text-success");
            status.classList.add("text-danger");
            return;
        }
        try {
            const res = await fetch("https://api.postalpincode.in/pincode/" + pin);
            const data = await res.json();
            if (data[0].Status === "Success" && data[0].PostOffice && data[0].PostOffice.length > 0) {
                const po = data[0].PostOffice[0];
                const areaText = po.Name + ", " + po.District + ", " + po.State;
                areaInput.value = areaText;
                status.textContent = "Area fetched successfully for this PIN.";
                status.classList.remove("text-danger");
                status.classList.add("text-success");
            } else {
                status.textContent = "No area found for this PIN.";
                status.classList.remove("text-success");
                status.classList.add("text-danger");
            }
        } catch (err) {
            status.textContent = "Error fetching area. Please try again.";
            status.classList.remove("text-success");
            status.classList.add("text-danger");
        }
    }
    document.getElementById('complaintForm').onsubmit = function(e) {
        e.preventDefault();
        const currentUserEmail = localStorage.getItem('currentUserEmail') || 'demo@user.com';
        const userLocality = localStorage.getItem('currentUserLocality') || document.getElementById('area').value || '';
        const complaint = {
            id: Date.now(),
            citizenEmail: currentUserEmail,
            category: document.getElementById('category').value,
            description: document.getElementById('description').value,
            location: document.getElementById('location').value,
            pincode: document.getElementById('pincode').value,
            area: document.getElementById('area').value,
            locality: userLocality,
            status: 'Open',
            createdAt: new Date().toLocaleString()
        };
        let complaints = JSON.parse(localStorage.getItem('complaints')) || [];
        complaints.push(complaint);
        localStorage.setItem('complaints', JSON.stringify(complaints));
        alert('Complaint Submitted Successfully!');
        window.location.href = 'my_complaints.html';
    };
</script>
</body>
</html>
