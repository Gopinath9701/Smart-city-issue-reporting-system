<!DOCTYPE html>
<html>
<head>
    <title>System Login</title>
    <style>
        .login-box { width: 350px;
             margin: 100px auto;
             padding: 30px;
             border: 1px solid #e9c5c5;
             border-radius: 60px; 
             text-align: center; 
             box-shadow: 0px 4px 10px rgba(0,0,0,0.1); 
            }
            input, select {
                width: 100%; 
                padding: 10px; 
                margin: 10px 0; 
                border: 1px solid #ccc; 
                border-radius: 4px; 
                box-sizing: border-box;
            }
        .btn-login {
            width: 100%; 
            background: rgb(68, 150, 168); 
            color: white; 
            border: none; 
            padding: 12px; 
            cursor: pointer; 
            border-radius: 4px; 
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Login to Portal</h2>
        <form action="dashboard_redirect.html"> <select required>
                <option value="">Select Your Role</option>
                <option value="citizen">Citizen</option>
                <option value="dept">Department Officer</option>
                <option value="admin">Administrator</option>
            </select>
            <input type="email" placeholder="Email ID" required>
            <input type="password" placeholder="Password" required>
            <button type="submit" class="btn-login">Login</button>
        </form>
    </div>
</body>
</html>
