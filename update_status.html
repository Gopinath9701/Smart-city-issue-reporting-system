<!DOCTYPE html>
<html>
<head>
    <title>Update Complaint</title>
    <style>
        .box { width: 500px; margin: 50px auto; border: 1px solid #ccc; padding: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h3>Update Complaint Status (#105)</h3>
        <p><strong>Issue:</strong> Big pothole near Main Square.</p>
        <hr>
        <form>
            <label>Change Status:</label><br>
            <select style="width:100%; padding:10px; margin:10px 0;">
                <option>Open</option>
                <option>In Progress</option>
                <option>Resolved</option>
                <option>Rejected</option>
            </select><br>
            
            <label>Officer Remarks:</label><br>
            <textarea style="width:100%; height:80px; margin:10px 0;"></textarea><br>
            
            <button type="submit" style="background:green; color:white; padding:10px; border:none; width:100%;">Save Changes</button>
        </form>
    </div>
</body>
</html>
