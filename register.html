<!DOCTYPE html>
<html lang="en">
<head>
    <title>Citizen Registration</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="bootstrap.min.css" rel="stylesheet">
    <style>
        .error { color: red; font-size: 0.9em; }
    </style>
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card shadow-sm" style="max-width: 450px; width: 100%;">
            <div class="card-body p-4">
                <h2 class="text-center mb-4">Citizen Registration Form</h2>
                <form id="registerForm" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="Enter your name" required>
                        <div class="error" id="nameError"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Enter email" required>
                        <div class="error" id="emailError"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Create password" required>
                        <div class="error" id="passwordError"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required>
                        <div class="error" id="confirmPasswordError"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phone" name="phone" placeholder="Enter mobile number">
                        <div class="error" id="phoneError"></div>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Register Now</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    Already have an account? <a href="login.html">Login here</a>
                </p>
            </div>
        </div>
    </div>
    <script>
        const form = document.getElementById("registerForm");
        form.addEventListener("submit", function(event) {
            event.preventDefault();
            let valid = true;
            const name = document.getElementById("name").value.trim();
            if (!/^[a-zA-Z\s]{3,}$/.test(name)) {
                document.getElementById("nameError").textContent = "Name must be at least 3 letters (letters and spaces only).";
                valid = false;
            } else {
                document.getElementById("nameError").textContent = "";
            }
            const email = document.getElementById("email").value.trim();
            const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,}$/;
            if (!emailPattern.test(email)) {
                document.getElementById("emailError").textContent = "Enter a valid email address.";
                valid = false;
            } else {
                document.getElementById("emailError").textContent = "";
            }
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            let strength = 0;
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) strength++;

            if (password.length < 6 || strength < 3) {
                document.getElementById("passwordError").textContent = "Password must be at least 6 characters and include 3 of: lowercase, uppercase, digit, special character.";
                valid = false;
            } else {
                document.getElementById("passwordError").textContent = "";
            }
            if (password !== confirmPassword) {
                document.getElementById("confirmPasswordError").textContent = "Passwords do not match.";
                valid = false;
            } else {
                document.getElementById("confirmPasswordError").textContent = "";
            }
            const phone = document.getElementById("phone").value.trim();
            if (phone && !/^[0-9]{10}$/.test(phone)) {
                document.getElementById("phoneError").textContent = "Phone number must be exactly 10 digits.";
                valid = false;
            } else {
                document.getElementById("phoneError").textContent = "";
            }
            if (valid) {
                alert("Registration completed successfully!");
                form.reset();
            }
        });
    </script>
    <script src="bootstrap.bundle.min.js"></script>
</body>
</html>
