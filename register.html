<!DOCTYPE html>
<html>
<head>
    <title>Citizen Registration</title>
    <link rel="stylesheet" href="style.css"> <style>
        .form-container { width: 400px; margin: 50px auto; padding: 30px; border: 1px solid #ddd; border-radius: 8px; background: #f9f9f9; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-submit { width: 100%; background: #27ae60; color: white; border: none; padding: 12px; cursor: pointer; border-radius: 4px; font-size: 16px; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2 style="text-align: center;">Citizen Registration</h2>
        <form action="RegisterServlet" method="POST">
    <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" placeholder="Enter your name" required>
    </div>
    <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="Enter email" required>
    </div>
    <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Create password" required>
    </div>
    <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" name="phone" placeholder="Enter mobile number">
    </div>
    <button type="submit" class="btn-submit">Register Now</button>
</form>
        <p style="text-align: center;">Already have an account? <a href="login.html">Login here</a></p>
    </div>
</body>
</html>
