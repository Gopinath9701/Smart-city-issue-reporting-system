<!DOCTYPE html>
<html lang="en">
<head>
    <title>Reset Password</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card shadow-lg border-0" style="max-width: 400px; border-radius: 20px;">
            <div class="card-body p-4">
                <h3 class="text-center mb-3">Reset Password</h3>
                <p class="text-muted small text-center">
                    Enter your new password below.
                </p>
                <form id="resetForm" onsubmit="return false;">
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password" id="newPassword" class="form-control" placeholder="Enter new password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm new password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-2" onclick="resetPassword()">
                        Save New Password
                    </button>
                    <a href="login.html" class="btn btn-link w-100">
                        Back to Login
                    </a>
                </form>
                <p id="resetStatus" class="text-center text-muted small mt-2"></p>
            </div>
        </div>
    </div>
    <script src="bootstrap.bundle.min.js"></script>
    <script>
        function resetPassword() {
            const newPwd = document.getElementById('newPassword').value.trim();
            const confirmPwd = document.getElementById('confirmPassword').value.trim();
            const status = document.getElementById('resetStatus');
            if (!newPwd || !confirmPwd) {
                status.textContent = "Please fill both password fields.";
                status.classList.remove("text-success");
                status.classList.add("text-danger");
                return;
            }
            if (newPwd !== confirmPwd) {
                status.textContent = "Passwords do not match.";
                status.classList.remove("text-success");
                status.classList.add("text-danger");
                return;
            }
            const email = localStorage.getItem('otpUserEmail') || localStorage.getItem('currentUserEmail');
            if (!email) {
                status.textContent = "No user found for reset. Please login again.";
                status.classList.remove("text-success");
                status.classList.add("text-danger");
                return;
            }
            let users = JSON.parse(localStorage.getItem('users')) || [];
            const idx = users.findIndex(u => u.email === email);
            if (idx !== -1) {
                users[idx].password = newPwd;
                localStorage.setItem('users', JSON.stringify(users));
            }
            status.textContent = "Password reset successfully. You can login with your new password.";
            status.classList.remove("text-danger");
            status.classList.add("text-success");
            setTimeout(() => {
                window.location.href = "login.html";
            }, 1500);
        }
    </script>
</body>
</html>
