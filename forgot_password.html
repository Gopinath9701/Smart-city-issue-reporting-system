<!DOCTYPE html>
<html lang="en">
<head>
    <title>Forgot Password</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card shadow-lg border-0" style="max-width: 400px; border-radius: 20px;">
            <div class="card-body p-4">
                <h3 class="text-center mb-3">Forgot Password</h3>
                <p class="text-muted small text-center">
                    Enter your registered phone number or email to receive an OTP.
                </p>
                <form onsubmit="return false;">
                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phone" placeholder="Enter phone number">
                    </div>
                    <div class="mb-3 text-center">
                        <span class="text-muted small">OR</span>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter email">
                    </div>
                    <div class="d-grid mb-3">
                        <button type="button" class="btn btn-secondary" onclick="sendOtp()">
                            Send OTP
                        </button>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">OTP</label>
                        <input type="text" class="form-control" id="otp" placeholder="Enter OTP">
                    </div>
                    <button type="button" class="btn btn-primary w-100 mb-2" onclick="verifyOtp()">
                        Verify OTP
                    </button>
                    <a href="login.html" class="btn btn-link w-100">
                        Back to Login
                    </a>
                </form>
                <p id="statusMsg" class="text-center text-muted small mt-2"></p>
            </div>
        </div>
    </div>
    <script src="bootstrap.bundle.min.js"></script>
    <script>
        let generatedOtp = null;
        function sendOtp() {
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            const status = document.getElementById('statusMsg');
            if (!phone && !email) {
                status.textContent = "Please enter phone or email to send OTP.";
                status.classList.remove("text-success");
                status.classList.add("text-danger");
                return;
            }
            generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();
            status.textContent = "OTP has been sent (demo only, OTP: " + generatedOtp + ").";
            status.classList.remove("text-danger");
            status.classList.add("text-success");
        }
        function verifyOtp() {
            const entered = document.getElementById('otp').value.trim();
            const status = document.getElementById('statusMsg');
            if (!generatedOtp) {
                status.textContent = "Please click 'Send OTP' first.";
                status.classList.remove("text-success");
                status.classList.add("text-danger");
                return;
            }
            if (entered === generatedOtp) {
                status.textContent = "OTP verified successfully. You can now reset your password (demo).";
                status.classList.remove("text-danger");
                status.classList.add("text-success");
            } else {
                status.textContent = "Invalid OTP. Please try again.";
                status.classList.remove("text-success");
                status.classList.add("text-danger");
            }
        }
    </script>
</body>
</html>
