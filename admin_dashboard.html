<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Dashboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="bootstrap.min.css" rel="stylesheet" >
</head>
<body>
    <div class="container-fluid py-4">
        <h1 class="mb-4">System Overview (Admin)</h1>
        <div class="row mb-4 g-4">
            <div class="col-md-4">
                <div class="card text-white bg-primary">
                    <div class="card-body text-center">
                        <h3 class="card-title">Total Complaints</h3>
                        <p class="card-text fs-1 fw-bold">150</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-warning">
                    <div class="card-body text-center">
                        <h3 class="card-title">Pending</h3>
                        <p class="card-text fs-1 fw-bold">45</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-success">
                    <div class="card-body text-center">
                        <h3 class="card-title">Resolved</h3>
                        <p class="card-text fs-1 fw-bold">105</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="card-header">
                <h3 class="mb-0">Recent Activity Across All Departments</h3>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Dept Name</th>
                                <th>Total Received</th>
                                <th>Resolved</th>
                                <th>Efficiency %</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Water Dept</td>
                                <td>40</td>
                                <td>35</td>
                                <td><span class="badge bg-success">87%</span></td>
                            </tr>
                            <tr>
                                <td>Electricity</td>
                                <td>60</td>
                                <td>50</td>
                                <td><span class="badge bg-success">83%</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="mt-4">
            <a href="manage_users.html" class="btn btn-primary me-3">Manage Users & Departments</a>
            <a href="reports.html" class="btn btn-outline-secondary">View Analytics</a>
        </div>
    </div>
    <script src="bootstrap.bundle.min.js" ></script>
    <script>
    const complaints = JSON.parse(localStorage.getItem('complaints')) || [];
    const tbody = document.getElementById('adminTableBody'); 
    const total = complaints.length;
    const resolved = complaints.filter(c => c.status === 'Resolved').length;
    const pending = total - resolved;
    complaints.forEach((c, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${index + 1}</td>
            <td>${c.category}</td>
            <td>${c.locality || ''}</td>
            <td>${c.status}</td>
            <td>${c.createdAt || ''}</td>
        `;
        tbody.appendChild(tr);
    });
</script>
</body>
</html>
